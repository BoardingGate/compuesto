<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Calculadora de Interés Compuesto y Renta de Jubilación - BoardingGate</title>
    <meta name="description" content="Simulador de interés compuesto ajustado a inflación y estimación de renta mensual para jubilación y desacumulación de patrimonio." />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <meta name="theme-color" content="#0a0a0a" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>window.Babel = { disableAutoDiscovery: true };</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #e5e5e5;
            -webkit-font-smoothing: antialiased;
        }
        .font-display { font-family: 'Orbitron', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script id="react-app" type="text/plain">
        const { useState, useEffect, useMemo } = React;
        const { createRoot } = ReactDOM;

        const formatN = (v, dec = 2) => {
            let n = parseFloat(v) || 0;
            let parts = n.toFixed(dec).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return parts.join(',');
        };

        const formatMoney = (v, c = 'EUR') => {
            let n = parseFloat(v) || 0;
            let base = n.toFixed(2).replace('.', ',');
            while (base.match(/\d{4,}/)) {
                base = base.replace(/(\d)(\d{3}[,.])/, '$1.$2');
            }
            let parts = base.split(',');
            parts[0] = parts[0].replace(/\./g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            base = parts.join(',');
            if (c === 'USD') return `$ ${base}`;
            if (c === 'GBP') return `£ ${base}`;
            return `${base} €`;
        };

        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch { return initialValue; }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(state)); } catch {}
            }, [key, state]);
            return [state, setState];
        };

        const FormattedInput = ({ value, onChange, decimals = 0, grouped = false }) => {
            const getDisplayString = (val) => {
                if (val === null || val === undefined || val === '') return '';
                return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: Math.max(decimals, 6), useGrouping: grouped }).format(val);
            };
            const [localValue, setLocalValue] = useState(() => getDisplayString(value));
            const [isFocused, setIsFocused] = useState(false);

            useEffect(() => {
                if (!isFocused) setLocalValue(getDisplayString(value));
            }, [value, isFocused, decimals, grouped]);

            const handleChange = (e) => {
                const inputVal = e.target.value;
                setLocalValue(inputVal);
                if (inputVal === '' || inputVal === '-') return;
                if (!/^[\d.,-]+$/.test(inputVal)) return;
                let normalized = grouped ? inputVal.replace(/\./g, '').replace(/,/g, '.') : inputVal.replace(/,/g, '.');
                if (normalized.endsWith('.')) return;
                const num = parseFloat(normalized);
                if (!isNaN(num)) onChange(num);
            };

            const handleFocus = () => {
                setIsFocused(true);
                if (value !== null && value !== undefined) {
                    if (grouped) setLocalValue(getDisplayString(value));
                    else setLocalValue(value.toString().replace('.', ','));
                }
            };

            return (
                <input
                    type="text"
                    inputMode="decimal"
                    value={localValue}
                    onChange={handleChange}
                    onFocus={handleFocus}
                    onBlur={() => setIsFocused(false)}
                    onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-white font-mono font-bold focus:outline-none focus:border-cyan-500 text-base text-right shadow-inner"
                />
            );
        };

        const Icons = {
            TrendingUp: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            DollarSign: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
            Zap: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
            Table: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 3h18v18H3z"></path><path d="M21 9H3"></path><path d="M21 15H3"></path><path d="M12 3v18"></path></svg>,
            Globe: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
            ExternalLink: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        };

        const App = () => {
            const baseCurrency = 'EUR';
            const [compState, setCompState] = usePersistentState('bg_standalone_compoundCalc', {
                startYear: new Date().getFullYear(),
                currentAge: 25,
                principal: 1000,
                annualAddition: 1200,
                years: 35,
                rate: 10,
                inflationRate: 0,
                compoundsPerYear: 1,
                addAtStart: true
            });

            const [showCompTable, setShowCompTable] = useState(false);
            const [showDrawdownTable, setShowDrawdownTable] = useState(false);

            const [drawdownState, setDrawdownState] = usePersistentState('bg_standalone_drawdown', {
                mode: 'byMonthly',
                desiredMonthly: 2000,
                desiredYears: 25,
                rate: 8.0,
                useRealBalance: true
            });

            const calculateCompound = () => {
                let balance = compState.principal;
                let totalPrincipal = compState.principal;
                const history = [];
                let crossoverYear = null;
                const r = compState.rate / 100;
                const inf = (compState.inflationRate || 0) / 100;
                const n = compState.compoundsPerYear;
                const effectiveAnnualRate = Math.pow(1 + (r / n), n) - 1;

                const baseYear = parseInt(compState.startYear) || new Date().getFullYear();
                const baseAge = parseInt(compState.currentAge) || 0;

                let lastBagger = 0;
                const baggers = [];

                for (let i = 1; i <= compState.years; i++) {
                    let contribution = compState.annualAddition;
                    if (compState.addAtStart) { balance += contribution; totalPrincipal += contribution; }
                    const interestEarned = balance * effectiveAnnualRate;
                    balance += interestEarned;
                    if (!compState.addAtStart) { balance += contribution; totalPrincipal += contribution; }

                    const currentInterest = balance - totalPrincipal;
                    if (crossoverYear === null && currentInterest > totalPrincipal) {
                        crossoverYear = i;
                    }

                    const currentBagger = totalPrincipal > 0 ? Math.floor(currentInterest / totalPrincipal) : 0;
                    const yearBaggers = [];
                    if (currentBagger > lastBagger) {
                        for (let b = lastBagger + 1; b <= currentBagger; b++) {
                            baggers.push({ year: i, level: b });
                            yearBaggers.push(b);
                        }
                        lastBagger = currentBagger;
                    }

                    const realBalance = balance / Math.pow(1 + inf, i);
                    history.push({
                        year: i,
                        calYear: baseYear + i,
                        age: baseAge > 0 ? baseAge + i : null,
                        principal: totalPrincipal,
                        interest: currentInterest,
                        balance: balance,
                        realBalance: realBalance,
                        yearBaggers: yearBaggers
                    });
                }
                const finalRealBalance = balance / Math.pow(1 + inf, compState.years);
                return { finalBalance: balance, finalRealBalance, totalPrincipal, history, crossoverYear, baggers };
            };

            const compResult = calculateCompound();
            const handleCompChange = (k, v) => setCompState(p => ({ ...p, [k]: parseFloat(v) || 0 }));

            const sYear = parseInt(compState.startYear) || new Date().getFullYear();
            const sAge = parseInt(compState.currentAge) || 0;
            const endAccumYear = sYear + Math.round(compState.years);
            const endAccumAge = sAge > 0 ? sAge + Math.round(compState.years) : null;

            // Desacumulación
            const startCapital = drawdownState.useRealBalance ? compResult.finalRealBalance : compResult.finalBalance;
            const rAnual = (parseFloat(drawdownState.rate) || 0) / 100;
            const rMes = rAnual / 12;
            const wDesired = parseFloat(drawdownState.desiredMonthly) || 0;
            const yDesired = Math.max(1, parseFloat(drawdownState.desiredYears) || 1);

            let durationMonths = 0;
            let isPerpetual = false;
            if (startCapital > 0 && wDesired > 0) {
                if (rMes <= 0) {
                    durationMonths = startCapital / wDesired;
                } else {
                    const interestMonthly = startCapital * rMes;
                    if (wDesired <= interestMonthly) {
                        isPerpetual = true;
                    } else {
                        durationMonths = -Math.log(1 - (startCapital * rMes) / wDesired) / Math.log(1 + rMes);
                    }
                }
            }
            const durationYearsTotal = durationMonths / 12;
            const exhaustYear = endAccumYear + Math.floor(durationYearsTotal);
            const exhaustAge = endAccumAge ? endAccumAge + Math.floor(durationYearsTotal) : null;

            const totalMonthsDesired = yDesired * 12;
            let obtainableMonthly = 0;
            if (startCapital > 0 && totalMonthsDesired > 0) {
                if (rMes <= 0) {
                    obtainableMonthly = startCapital / totalMonthsDesired;
                } else {
                    obtainableMonthly = startCapital * ((rMes * Math.pow(1 + rMes, totalMonthsDesired)) / (Math.pow(1 + rMes, totalMonthsDesired) - 1));
                }
            }
            const fixedEndYear = endAccumYear + Math.round(yDesired);
            const fixedEndAge = endAccumAge ? endAccumAge + Math.round(yDesired) : null;

            const effectiveMonthlyPayout = drawdownState.mode === 'byMonthly' ? wDesired : obtainableMonthly;
            const perpetualMonthlyInterest = startCapital * rMes;

            const drawdownHistory = useMemo(() => {
                if (startCapital <= 0 || effectiveMonthlyPayout <= 0) return [];
                const rows = [];
                let currentFund = startCapital;
                let currentYearIndex = 1;
                const maxSimulationYears = isPerpetual ? 50 : Math.min(60, Math.ceil(drawdownState.mode === 'byMonthly' ? durationYearsTotal : yDesired) + 1);

                while (currentFund > 0.01 && currentYearIndex <= maxSimulationYears) {
                    const yearStartBalance = currentFund;
                    let yearInterestEarned = 0;
                    let yearWithdrawn = 0;

                    for (let m = 1; m <= 12; m++) {
                        if (currentFund <= 0) break;
                        const monthlyInterest = currentFund * rMes;
                        yearInterestEarned += monthlyInterest;
                        currentFund += monthlyInterest;

                        const actualWithdrawal = Math.min(currentFund, effectiveMonthlyPayout);
                        yearWithdrawn += actualWithdrawal;
                        currentFund -= actualWithdrawal;
                    }

                    const cYear = endAccumYear + currentYearIndex;
                    const cAge = endAccumAge ? endAccumAge + currentYearIndex : null;

                    rows.push({
                        yearIndex: currentYearIndex,
                        calYear: cYear,
                        age: cAge,
                        startBalance: yearStartBalance,
                        withdrawn: yearWithdrawn,
                        interestEarned: yearInterestEarned,
                        endBalance: Math.max(0, currentFund)
                    });

                    if (currentFund <= 0) break;
                    currentYearIndex++;
                }
                return rows;
            }, [startCapital, effectiveMonthlyPayout, rMes, isPerpetual, durationYearsTotal, yDesired, drawdownState.mode, endAccumYear, endAccumAge]);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* CABECERA CON LOGO BOARDINGGATE */}
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl font-display font-black tracking-wider text-white">
                                Boarding<span className="text-blue-500">Gate</span>
                            </span>
                            <span className="text-[10px] bg-blue-900/40 border border-blue-500/40 text-blue-300 font-bold px-2 py-0.5 rounded-full uppercase tracking-widest">
                                Tools
                            </span>
                        </div>
                        <a 
                            href="https://boardinggate.github.io/BOLSA/BOLSA.HTML" 
                            className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all flex items-center gap-2 shadow-lg border border-blue-400/40 uppercase tracking-wider"
                        >
                            <span>Terminal de Inversión</span>
                            <Icons.ExternalLink className="w-3.5 h-3.5" />
                        </a>
                    </header>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full space-y-8">
                        <div className="bg-slate-900/80 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-2xl space-y-8">
                            <div>
                                <h2 className="text-2xl md:text-3xl font-display font-bold text-green-400 flex items-center gap-3">
                                    <Icons.TrendingUp className="w-8 h-8 text-green-400" />
                                    Interés Compuesto y Renta de Jubilación
                                </h2>
                                <p className="text-slate-400 text-xs mt-1">
                                    Simulación matemática de acumulación de patrimonio ajustada a inflación y cálculo de la fase de desacumulación.
                                </p>
                            </div>

                            {/* PARTIDA TEMPORAL Y SUJETO */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 p-5 bg-slate-950/70 rounded-2xl border border-slate-800">
                                <div>
                                    <label className="text-xs font-bold text-cyan-400 block mb-2 uppercase tracking-wider">Año de Inicio</label>
                                    <FormattedInput value={compState.startYear} onChange={v => handleCompChange('startYear', v)} decimals={0} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-cyan-400 block mb-2 uppercase tracking-wider">Edad Actual del Sujeto</label>
                                    <FormattedInput value={compState.currentAge} onChange={v => handleCompChange('currentAge', v)} decimals={0} />
                                </div>
                                <div className="flex flex-col justify-center text-left">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Fin de Acumulación</span>
                                    <div className="text-sm font-bold text-white font-mono mt-1">
                                        Año {endAccumYear} {endAccumAge ? `(a los ${endAccumAge} años)` : ''}
                                    </div>
                                </div>
                                <div className="flex flex-col justify-center text-left">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Horizonte Ahorro</span>
                                    <div className="text-sm font-bold text-green-400 font-mono mt-1">
                                        {compState.years} años de aportaciones
                                    </div>
                                </div>
                            </div>

                            {/* VARIABLES FINANCIERAS */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                                <div><label className="text-xs font-bold text-slate-400 block mb-2 uppercase tracking-wider">Capital Inicial</label><FormattedInput value={compState.principal} onChange={v => handleCompChange('principal', v)} grouped={true} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-2 uppercase tracking-wider">Aportación Anual</label><FormattedInput value={compState.annualAddition} onChange={v => handleCompChange('annualAddition', v)} grouped={true} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-2 uppercase tracking-wider">Años Acumulación</label><FormattedInput value={compState.years} onChange={v => handleCompChange('years', v)} decimals={0} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-2 uppercase tracking-wider">Interés Anual (%)</label><FormattedInput value={compState.rate} onChange={v => handleCompChange('rate', v)} decimals={2} /></div>
                                <div><label className="text-xs font-bold text-slate-400 block mb-2 uppercase tracking-wider">Inflación Anual (%)</label><FormattedInput value={compState.inflationRate} onChange={v => handleCompChange('inflationRate', v)} decimals={2} /></div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-6 border-b border-slate-800">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-2 uppercase">Capitalización al año</label>
                                    <div className="flex items-center gap-4">
                                        <input type="range" min="1" max="12" step="1" value={compState.compoundsPerYear} onChange={e => handleCompChange('compoundsPerYear', e.target.value)} className="flex-grow h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                        <div className="w-24 text-right font-bold text-white bg-slate-800 px-3 py-2 rounded border border-slate-600">{compState.compoundsPerYear} {compState.compoundsPerYear === 1 ? 'vez' : 'veces'}</div>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-3 uppercase">Momento de aportación</label>
                                    <div className="flex gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" className="accent-blue-500 w-4 h-4" checked={compState.addAtStart} onChange={() => setCompState(p => ({...p, addAtStart: true}))} /><span className={`text-sm font-bold ${compState.addAtStart ? 'text-white' : 'text-slate-400 group-hover:text-slate-300'}`}>Inicio del periodo</span></label>
                                        <label className="flex items-center gap-2 cursor-pointer group"><input type="radio" className="accent-blue-500 w-4 h-4" checked={!compState.addAtStart} onChange={() => setCompState(p => ({...p, addAtStart: false}))} /><span className={`text-sm font-bold ${!compState.addAtStart ? 'text-white' : 'text-slate-400 group-hover:text-slate-300'}`}>Final del periodo</span></label>
                                    </div>
                                </div>
                            </div>

                            {/* TARJETA RESUMEN DE ACUMULACIÓN */}
                            <div className="bg-gradient-to-r from-green-950/40 to-slate-900 rounded-2xl p-6 border border-green-500/40 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-xl">
                                <div className="text-center md:text-left flex-grow">
                                    <div className="text-xs font-bold text-green-400 uppercase tracking-widest mb-1">
                                        Valor Futuro al Año {endAccumYear} {endAccumAge ? `(Edad: ${endAccumAge} años)` : ''}
                                    </div>
                                    <div className="text-3xl font-display font-bold text-white">{formatMoney(compResult.finalRealBalance)} {baseCurrency}</div>
                                    <div className="text-sm font-bold text-slate-500 mt-1">{formatMoney(compResult.finalBalance)} {baseCurrency} <span className="text-xs font-normal">(Nominal sin restar inflación)</span></div>
                                    
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        {compResult.crossoverYear && (
                                            <div className="text-[10px] font-bold text-blue-300 bg-blue-900/30 border border-blue-500/30 px-3 py-1.5 rounded-lg">
                                                <Icons.TrendingUp className="w-3 h-3 inline mr-1 -mt-0.5" />
                                                Punto de Inflexión: En el Año {compResult.crossoverYear} (Año {sYear + compResult.crossoverYear}{sAge > 0 ? ` · ${sAge + compResult.crossoverYear} años` : ''}) los intereses generados superan al capital aportado.
                                            </div>
                                        )}
                                        {compResult.baggers && compResult.baggers.length > 0 && (
                                            <div className="text-[10px] font-bold text-green-300 bg-green-900/30 border border-green-500/30 px-3 py-1.5 rounded-lg">
                                                <Icons.Zap className="w-3 h-3 inline mr-1 -mt-0.5" />
                                                Hitos Multiplicadores: {compResult.baggers.map(b => `Año ${b.year} (${sYear + b.year}${sAge > 0 ? ` · ${sAge + b.year}a` : ''}: ${b.level}-Bagger)`).join(', ')}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div className="flex gap-6 text-right shrink-0">
                                    <div><div className="text-[10px] font-bold text-slate-400 uppercase">Total Aportado</div><div className="text-lg font-bold text-slate-200">{formatMoney(compResult.totalPrincipal)} {baseCurrency}</div></div>
                                    <div><div className="text-[10px] font-bold text-green-400 uppercase">Beneficio Neto</div><div className="text-lg font-bold text-green-400">+{formatMoney(compResult.finalRealBalance - compResult.totalPrincipal)} {baseCurrency}</div></div>
                                </div>
                            </div>

                            {/* SUBPANEL: DESACUMULACIÓN Y RENTA */}
                            <div className="bg-slate-950/90 rounded-2xl p-6 border-2 border-cyan-500/40 shadow-2xl space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                                    <div>
                                        <h4 className="text-base font-display font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                                            <Icons.DollarSign className="w-5 h-5 text-cyan-400" />
                                            ESTIMACIÓN DE RENTA MENSUAL A FIN DE PERIODO Y DISPONIBILIDAD
                                        </h4>
                                        <p className="text-[10px] text-slate-400 mt-1 font-sans">
                                            Inicio de desacumulación: <strong className="text-white">Año {endAccumYear}</strong> {endAccumAge ? `(a los ${endAccumAge} años de edad)` : ''}. Saldo vivo revalorizándose periódicamente en mercado.
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-700 shrink-0">
                                        <button 
                                            onClick={() => setDrawdownState(p => ({ ...p, useRealBalance: true }))}
                                            className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${drawdownState.useRealBalance ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Capital Real (Aj. Inflación)
                                        </button>
                                        <button 
                                            onClick={() => setDrawdownState(p => ({ ...p, useRealBalance: false }))}
                                            className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${!drawdownState.useRealBalance ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Capital Nominal
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Capital Inicial al Retiro</span>
                                        <div className="text-2xl font-black text-white font-mono mt-2">
                                            {formatMoney(startCapital)} {baseCurrency}
                                        </div>
                                        <span className="text-[8.5px] text-cyan-400 mt-1 block">
                                            Año {endAccumYear} {endAccumAge ? `(Edad: ${endAccumAge} años)` : ''} · {drawdownState.useRealBalance ? 'Poder Adquisitivo Real' : 'Nominal'}
                                        </span>
                                    </div>

                                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Rendimiento Anual en Retiro (%)</span>
                                        <div className="mt-2">
                                            <FormattedInput value={drawdownState.rate} onChange={v => setDrawdownState(p => ({ ...p, rate: v }))} decimals={2} />
                                        </div>
                                        <span className="text-[8.5px] text-slate-500 mt-1 block">
                                            Revalorización estimada del capital restante en mercado
                                        </span>
                                    </div>

                                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Modo de Cálculo</span>
                                        <div className="flex gap-2 mt-2">
                                            <button 
                                                onClick={() => setDrawdownState(p => ({ ...p, mode: 'byMonthly' }))}
                                                className={`flex-1 py-2.5 px-2 rounded-lg text-[9px] font-black uppercase transition-all ${drawdownState.mode === 'byMonthly' ? 'bg-blue-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                            >
                                                Fijar Renta Mensual
                                            </button>
                                            <button 
                                                onClick={() => setDrawdownState(p => ({ ...p, mode: 'byYears' }))}
                                                className={`flex-1 py-2.5 px-2 rounded-lg text-[9px] font-black uppercase transition-all ${drawdownState.mode === 'byYears' ? 'bg-blue-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                            >
                                                Fijar Plazo en Años
                                            </button>
                                        </div>
                                        <span className="text-[8.5px] text-slate-500 mt-1 block text-center">
                                            {drawdownState.mode === 'byMonthly' ? 'Estima los años/meses de vida útil' : 'Calcula la renta exacta hasta agotar'}
                                        </span>
                                    </div>
                                </div>

                                {drawdownState.mode === 'byMonthly' ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-gradient-to-r from-blue-950/40 to-slate-900 p-5 rounded-xl border border-blue-500/30">
                                        <div>
                                            <label className="text-xs font-bold text-blue-300 uppercase block mb-2">Renta Mensual Deseada</label>
                                            <FormattedInput value={drawdownState.desiredMonthly} onChange={v => setDrawdownState(p => ({ ...p, desiredMonthly: v }))} grouped={true} />
                                            <div className="text-[10px] text-slate-400 mt-2">
                                                Interés mensual generado: <span className="text-white font-mono font-bold">+{formatMoney(perpetualMonthlyInterest)} {baseCurrency}/mes</span>.
                                            </div>
                                        </div>

                                        <div className="text-center md:text-right border-t md:border-t-0 md:border-l border-slate-800 pt-4 md:pt-0 md:pl-6">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Disponibilidad del Capital</span>
                                            {isPerpetual ? (
                                                <>
                                                    <div className="text-2xl font-black text-green-400 font-display">VITALICIA / INDEFINIDA</div>
                                                    <p className="text-[10px] text-green-300/80 mt-1">
                                                        Los rendimientos ({formatMoney(perpetualMonthlyInterest)} {baseCurrency}) superan el retiro ({formatMoney(wDesired)} {baseCurrency}). <b>El capital no se agota.</b>
                                                    </p>
                                                </>
                                            ) : durationMonths > 0 ? (
                                                <>
                                                    <div className="text-3xl font-black text-white font-display">
                                                        {formatN(durationYearsTotal, 1)} Años
                                                    </div>
                                                    <span className="text-xs font-bold text-cyan-400 font-mono block mt-1">
                                                        ~ {Math.floor(durationMonths)} meses (Cubre hasta el Año {exhaustYear}{exhaustAge ? ` · ${exhaustAge} años de edad` : ''})
                                                    </span>
                                                    <p className="text-[9px] text-slate-400 mt-2 font-sans">
                                                        Desde el Año {endAccumYear} {endAccumAge ? `(${endAccumAge}a)` : ''} hasta el Año {exhaustYear} {exhaustAge ? `(${exhaustAge}a)` : ''} disponiendo de {formatMoney(wDesired)} al mes.
                                                    </p>
                                                </>
                                            ) : (
                                                <div className="text-sm font-bold text-slate-500">Introduce una renta mensual válida</div>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-gradient-to-r from-purple-950/40 to-slate-900 p-5 rounded-xl border border-purple-500/30">
                                        <div>
                                            <label className="text-xs font-bold text-purple-300 uppercase block mb-2">Años Deseados de Cobertura (Retiro)</label>
                                            <FormattedInput value={drawdownState.desiredYears} onChange={v => setDrawdownState(p => ({ ...p, desiredYears: v }))} decimals={0} />
                                            <div className="text-[10px] text-slate-400 mt-2">
                                                Cubre desde el Año {endAccumYear}{endAccumAge ? ` (${endAccumAge}a)` : ''} hasta el Año {fixedEndYear}{fixedEndAge ? ` (${fixedEndAge}a)` : ''} ({totalMonthsDesired} pagas).
                                            </div>
                                        </div>

                                        <div className="text-center md:text-right border-t md:border-t-0 md:border-l border-slate-800 pt-4 md:pt-0 md:pl-6">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Renta Mensual Disponible</span>
                                            <div className="text-3xl font-black text-green-400 font-display font-mono">
                                                {formatMoney(obtainableMonthly)} {baseCurrency}<span className="text-xs text-slate-400 font-normal">/mes</span>
                                            </div>
                                            <span className="text-xs font-bold text-purple-300 font-mono block mt-1">
                                                {formatMoney(obtainableMonthly * 12)} {baseCurrency} anuales
                                            </span>
                                            <p className="text-[9px] text-slate-400 mt-2 font-sans">
                                                Extrayendo esta cuota mensual durante {yDesired} años, el capital se consumirá de forma constante hasta los {fixedEndAge ? `${fixedEndAge} años de edad` : `finalizar en ${fixedEndYear}`}.
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* BOTONERA DOBLE DE DESGLOSES */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                                <button 
                                    onClick={() => { setShowCompTable(!showCompTable); if (!showCompTable) setShowDrawdownTable(false); }} 
                                    className={`w-full py-4 rounded-xl text-xs font-bold uppercase tracking-widest transition-all flex items-center justify-center gap-2 border shadow-lg ${
                                        showCompTable 
                                            ? 'bg-blue-600 border-blue-400 text-white' 
                                            : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300'
                                    }`}
                                >
                                    <Icons.Table className="w-4 h-4" /> {showCompTable ? 'Ocultar Desglose Acumulación' : 'Ver Desglose Acumulación (Aportes)'}
                                </button>

                                <button 
                                    onClick={() => { setShowDrawdownTable(!showDrawdownTable); if (!showDrawdownTable) setShowCompTable(false); }} 
                                    className={`w-full py-4 rounded-xl text-xs font-bold uppercase tracking-widest transition-all flex items-center justify-center gap-2 border shadow-lg ${
                                        showDrawdownTable 
                                            ? 'bg-cyan-600 border-cyan-400 text-white' 
                                            : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-cyan-300'
                                    }`}
                                >
                                    <Icons.DollarSign className="w-4 h-4" /> {showDrawdownTable ? 'Ocultar Desglose Desacumulación' : 'Ver Desglose Desacumulación (Retiro)'}
                                </button>
                            </div>

                            {/* TABLA 1: DESGLOSE ACUMULACIÓN */}
                            {showCompTable && (
                                <div className="overflow-x-auto rounded-xl border border-slate-800 animate-fade-in max-h-[500px] overflow-y-auto custom-scrollbar">
                                    <div className="bg-slate-900 p-2.5 text-[10px] font-black uppercase tracking-wider text-blue-300 border-b border-slate-800 text-center">
                                        Plan de Acumulación y Creación de Patrimonio (Años {sYear} a {endAccumYear})
                                    </div>
                                    <table className="w-full text-sm border-collapse text-right">
                                        <thead className="bg-slate-900 sticky top-0 z-10 text-[10px] uppercase font-bold text-slate-400">
                                            <tr>
                                                <th className="p-3 text-center">Periodo</th>
                                                <th className="p-3 text-center text-cyan-300">Año / Edad</th>
                                                <th className="p-3">Aportado</th>
                                                <th className="p-3">Interés</th>
                                                <th className="p-3 text-slate-300">Total Nominal</th>
                                                <th className="p-3 text-white border-l border-slate-700">Valor Real (Aj. Inflación)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-slate-900/50 divide-y divide-slate-800 font-mono">
                                            {compResult.history.map((row, idx) => {
                                                const isCrossover = compResult.crossoverYear === row.year;
                                                const yearBaggers = row.yearBaggers || [];
                                                const pctAcum = row.principal > 0 ? (row.interest / row.principal) * 100 : 0;
                                                
                                                let prevPctAcum = 0;
                                                if (idx > 0) {
                                                    const prevRow = compResult.history[idx - 1];
                                                    prevPctAcum = prevRow.principal > 0 ? (prevRow.interest / prevRow.principal) * 100 : 0;
                                                }
                                                const incrementPct = pctAcum - prevPctAcum;
                                                
                                                return (
                                                    <tr key={row.year} className={`${isCrossover ? 'bg-blue-900/20 border-l-4 border-l-blue-500 shadow-inner' : yearBaggers.length > 0 ? 'bg-green-900/10 border-l-4 border-l-green-500 shadow-inner' : 'hover:bg-slate-800/50'} transition-colors`}>
                                                        <td className="p-3 font-bold text-center relative">
                                                            <span className={isCrossover ? 'text-blue-400' : yearBaggers.length > 0 ? 'text-green-400' : 'text-slate-400'}>Año {row.year}</span>
                                                            {isCrossover && <div className="text-[7px] text-blue-400 uppercase tracking-tighter mt-0.5 font-sans leading-none">Inflexión</div>}
                                                            {yearBaggers.map(b => (
                                                                <div key={b} className="text-[7px] text-green-400 uppercase tracking-tighter mt-0.5 font-sans leading-none font-black">{b}-Bagger (+{b * 100}%)</div>
                                                            ))}
                                                        </td>
                                                        <td className="p-3 text-center font-sans font-bold text-cyan-300">
                                                            <div>{row.calYear}</div>
                                                            {row.age && <div className="text-[9px] text-slate-400 font-normal">{row.age} años</div>}
                                                        </td>
                                                        <td className="p-3 text-slate-300">{formatMoney(row.principal)}</td>
                                                        <td className="p-3 text-green-400 text-right">
                                                            <div className="font-bold">+{formatMoney(row.interest)}</div>
                                                            <div className="text-[9px] text-slate-500 font-sans mt-0.5 leading-tight">
                                                                Acumulado: <span className="text-slate-400 font-bold">{formatN(pctAcum)}%</span><br/>
                                                                Incr. Anual: <span className="text-slate-400 font-bold">+{formatN(incrementPct)}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-3 font-bold text-slate-300">{formatMoney(row.balance)}</td>
                                                        <td className="p-3 font-bold text-white text-base border-l border-slate-700">{formatMoney(row.realBalance)}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>                        
                                    </table>
                                </div>
                            )}

                            {/* TABLA 2: DESGLOSE DESACUMULACIÓN */}
                            {showDrawdownTable && (
                                <div className="overflow-x-auto rounded-xl border border-slate-800 animate-fade-in max-h-[500px] overflow-y-auto custom-scrollbar">
                                    <div className="bg-slate-900 p-2.5 text-[10px] font-black uppercase tracking-wider text-cyan-300 border-b border-slate-800 text-center flex justify-between items-center px-4">
                                        <span>Cronograma de Consumo y Renta (Inicia en Año {endAccumYear})</span>
                                        <span className="text-slate-400 font-mono font-normal">Cuota simulada: {formatMoney(effectiveMonthlyPayout)}/mes ({formatMoney(effectiveMonthlyPayout * 12)}/año)</span>
                                    </div>
                                    <table className="w-full text-sm border-collapse text-right">
                                        <thead className="bg-slate-900 sticky top-0 z-10 text-[10px] uppercase font-bold text-slate-400">
                                            <tr>
                                                <th className="p-3 text-center">Año Retiro</th>
                                                <th className="p-3 text-center text-cyan-300">Año / Edad</th>
                                                <th className="p-3 text-slate-300">Saldo Inicial</th>
                                                <th className="p-3 text-orange-400">Retiro Anual</th>
                                                <th className="p-3 text-green-400">Rendimiento (+%)</th>
                                                <th className="p-3 text-white border-l border-slate-700">Saldo Remanente</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-slate-900/50 divide-y divide-slate-800 font-mono">
                                            {drawdownHistory.map((row) => (
                                                <tr key={row.yearIndex} className="hover:bg-slate-800/50 transition-colors">
                                                    <td className="p-3 font-bold text-center text-slate-400 font-sans">
                                                        Año {row.yearIndex}
                                                    </td>
                                                    <td className="p-3 text-center font-sans font-bold text-cyan-300">
                                                        <div>{row.calYear}</div>
                                                        {row.age && <div className="text-[9px] text-slate-400 font-normal">{row.age} años</div>}
                                                    </td>
                                                    <td className="p-3 text-slate-300 font-bold">{formatMoney(row.startBalance)}</td>
                                                    <td className="p-3 text-orange-400 font-bold">-{formatMoney(row.withdrawn)}</td>
                                                    <td className="p-3 text-green-400">+{formatMoney(row.interestEarned)}</td>
                                                    <td className={`p-3 font-bold border-l border-slate-700 text-base ${row.endBalance <= 0 ? 'text-red-400' : 'text-white'}`}>
                                                        {formatMoney(row.endBalance)}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* PIE DE PÁGINA CON AUTORÍA, ENLACE A BOLSA2 Y CONTACTO EN X */}
                    <footer className="bg-slate-900 border-t border-slate-800 py-6 px-6 text-center text-xs text-slate-500 space-y-3">
                        <div className="flex flex-wrap justify-center items-center gap-6 font-bold uppercase tracking-wider text-[11px]">
                            <a 
                                href="https://boardinggate.github.io/BOLSA/BOLSA2.HTML" 
                                className="text-blue-400 hover:text-blue-300 transition-colors flex items-center gap-1.5"
                            >
                                <Icons.Globe className="w-4 h-4" /> Plataforma de Inversión en Bolsa
                            </a>
                            <span className="text-slate-700">|</span>
                            <a 
                                href="https://x.com/boardinggate" 
                                target="_blank" 
                                rel="noopener noreferrer" 
                                className="text-slate-300 hover:text-white transition-colors flex items-center gap-1.5"
                            >
                                <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                Contacto: @BoardingGate en X
                            </a>
                        </div>
                        <p className="text-[10px] text-slate-600">
                            Desarrollado y mantenido por <strong>BoardingGate</strong>. Proyecto independiente de software financiero y análisis cuantitativo.
                        </p>
                    </footer>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const code = document.getElementById('react-app').textContent;
        try {
          const transformed = Babel.transform(code, { 
            presets: [
              ['react', { "runtime": "classic" }],
              ['env', { "modules": false }]
            ]
          }).code;
          eval(transformed);
        } catch (err) {
          console.error("Error al cargar la aplicación:", err);
          alert("Error de sintaxis: " + err.message);
        }
      });
    </script>
</body>
</html>
